<aside
  class="dark fixed flex flex-col top-0 px-4 left-0 h-screen transition-all duration-300 ease-in-out z-50
    bg-[#0c0f1c]
    [backdrop-filter:blur(24px)]
    border-r border-[rgba(0,255,255,0.08)]
    text-white"
  [ngClass]="{
    'w-[290px]':
      (isExpanded$ | async) || (isMobileOpen$ | async) || (isHovered$ | async),
    'w-[90px]': !(
      (isExpanded$ | async) ||
      (isMobileOpen$ | async) ||
      (isHovered$ | async)
    ),
    'translate-x-0': isMobileOpen$ | async,
    '-translate-x-full': !(isMobileOpen$ | async),
    'xl:translate-x-0': true
  }"
  (mouseenter)="onSidebarMouseEnter()"
  (mouseleave)="sidebarService.setHovered(false)"
>
  <!-- Business logo + name -->
  <div class="py-4 flex flex-col items-center">
    <div class="rounded-lg overflow-hidden shrink-0">
      <img src="/images/coat-of-arms.png" alt="Business Logo" class="h-25 w-auto object-contain rounded-lg" />
    </div>
    @if ((isExpanded$ | async) || (isHovered$ | async) || (isMobileOpen$ | async)) {
      <span class="mt-3 text-sm font-bold text-white tracking-wide text-center">SOCIALSMARTTECH CO LTD</span>
    }
  </div>

  <div class="flex flex-col overflow-y-auto duration-300 ease-linear no-scrollbar">
    <nav class="mb-6">
      <div class="flex flex-col gap-4">
        <!-- Menu Section -->
        <div>
          <ul class="flex flex-col gap-1.5">
            @for (nav of navItems; track $index) {
            <li>
              @if (nav.path) {
              <a
                [routerLink]="nav.path"
                routerLinkActive="biz-menu-active"
                class="biz-menu-item group"
                [ngClass]="{ 'biz-menu-inactive': !isActive(nav.path) }"
                [title]="((isExpanded$ | async) || (isHovered$ | async) || (isMobileOpen$ | async)) ? null : nav.name"
                (click)="onMenuClick()"
              >
                <!-- Neon left bar — only shown when active, only in dark mode -->
                <span
                  class="biz-neon-bar hidden dark:block"
                  [class.opacity-0]="!isActive(nav.path)"
                  [class.opacity-100]="isActive(nav.path)"
                ></span>
                <span
                  class="biz-menu-icon"
                  [ngClass]="{
                    'biz-menu-icon-active': isActive(nav.path),
                    'text-gray-400 group-hover:text-gray-700 dark:group-hover:text-white': !isActive(nav.path)
                  }"
                  [innerHTML]="nav.icon | safeHtml"
                >
                </span>
                <span class="biz-menu-text">
                  @if ((isExpanded$ | async) || (isHovered$ | async) || (isMobileOpen$ | async)) {
                  {{ nav.name }}
                  }
                </span>
              </a>
              }
            </li>
            }
          </ul>
        </div>
        <!-- end main menu -->
      </div>
    </nav>
  </div>
  <!-- User profile — pinned to bottom -->
  <div class="mt-auto border-t border-[rgba(247,148,29,0.15)] py-4 relative overflow-visible">
    <app-user-dropdown />
  
  </div>

  <!-- Neon separator line — right edge glow -->
  <div class="hidden dark:block absolute top-0 right-0 bottom-0 w-px pointer-events-none"
    style="background: linear-gradient(180deg, transparent 0%, rgba(247,148,29,0.35) 40%, rgba(247,148,29,0.35) 60%, transparent 100%);">
  </div>
</aside>
