<div class="min-h-screen overflow-x-hidden xl:flex">
  <div>
    <app-business-sidebar></app-business-sidebar>
    <app-backdrop></app-backdrop>
  </div>
  <div
      class="flex-1 transition-all duration-300 ease-in-out flex flex-col min-h-screen overflow-x-hidden"
      [ngClass]="{
        'xl:ml-[290px]': (isExpanded$ | async) || (isHovered$ | async),
        'xl:ml-[90px]': !(isExpanded$ | async) && !(isHovered$ | async),
        'ml-0': (isMobileOpen$ | async)
      }"
  >
    <!-- app header start -->
    <app-business-header/>
    <!-- app header end -->
    <div class="p-4 md:p-6 w-full max-w-full">
      <router-outlet></router-outlet>
    </div>
    <!-- Footer -->
    <div class="mt-auto text-center text-gray-500 text-sm pb-6">
      &copy; 2026 {{ 'BUSINESS.FOOTER.RIGHTS' | translate }}
    </div>
  </div>
</div>
