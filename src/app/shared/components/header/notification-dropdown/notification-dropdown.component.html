<div class="relative">
  <style>
    @keyframes ring {
      0% { transform: rotate(0); }
      15% { transform: rotate(15deg); }
      30% { transform: rotate(-10deg); }
      45% { transform: rotate(5deg); }
      60% { transform: rotate(-5deg); }
      75% { transform: rotate(2deg); }
      100% { transform: rotate(0); }
    }
    .hover-ring:hover {
      animation: ring 1s ease-in-out;
      transform-origin: top center;
    }
    @keyframes bounce-in {
      0% { transform: scale(0); opacity: 0; }
      80% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
  <button
    class="relative flex items-center justify-center text-gray-500 transition-all bg-gray-50/80 border border-transparent rounded-full dropdown-toggle h-11 w-11 hover:bg-white hover:border-gray-200 hover:shadow-sm dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white group hover-ring"
    (click)="toggleDropdown()"
  >
    <span
      class="absolute -top-1 -right-1 z-10 flex h-[22px] min-w-[22px] items-center justify-center rounded-full bg-gradient-to-tr from-rose-500 to-red-400 px-1.5 text-[11px] font-bold text-white shadow-md border-[2px] border-white dark:border-gray-900 leading-none"
      [ngClass]="{ 'hidden': unreadCount === 0, 'flex': unreadCount > 0 }"
      style="animation: bounce-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;"
    >
      {{ unreadCount > 99 ? '99+' : unreadCount }}
    </span>
    
    <svg 
      xmlns="http://www.w3.org/2000/svg" 
      viewBox="0 0 24 24" 
      fill="currentColor" 
      class="w-[24px] h-[24px] transition-colors"
      [ngClass]="{'text-gray-800 dark:text-white': unreadCount > 0}"
    >
      <path fill-rule="evenodd" d="M5.25 9a6.75 6.75 0 0 1 13.5 0v.75c0 2.123.8 4.057 2.118 5.52a.75.75 0 0 1-.297 1.206c-1.544.57-3.16.99-4.831 1.243a3.75 3.75 0 1 1-7.48 0 24.585 24.585 0 0 1-4.831-1.244.75.75 0 0 1-.298-1.205A8.217 8.217 0 0 0 5.25 9.75V9Zm4.502 8.9a2.25 2.25 0 1 0 4.496 0 25.057 25.057 0 0 1-4.496 0Z" clip-rule="evenodd" />
    </svg>
  </button>
  <app-dropdown
    [isOpen]="isOpen"
    (close)="closeDropdown()"
    className="absolute -right-[240px] mt-[17px] flex h-[480px] w-[350px] flex-col rounded-2xl border border-gray-200 bg-white p-3 shadow-theme-lg dark:border-gray-800 dark:bg-gray-dark sm:w-[361px] lg:right-0"
  >
    <div class="flex items-center justify-between pb-3 mb-3 border-b border-gray-100 dark:border-gray-700">
      <h5 class="text-lg font-semibold text-gray-800 dark:text-gray-200">
        Notifications
      </h5>
      <span *ngIf="unreadCount > 0" class="bg-orange-100 text-orange-800 text-xs font-medium mr-2 px-2.5 py-0.5 rounded border border-orange-400">
        {{ unreadCount }} new
      </span>
    </div>
    <ul class="flex flex-col h-auto overflow-y-auto custom-scrollbar">
      <li *ngFor="let notification of notifications">
        <app-dropdown-item
          (itemClick)="onNotificationClick(notification)"
          [className]="'w-full text-left text-sm text-gray-700 hover:text-gray-900 flex gap-3 rounded-lg border-b border-gray-100 p-3 px-4.5 py-3 hover:bg-gray-100 dark:border-gray-800 dark:hover:bg-white/5 ' + (!notification.is_read ? 'bg-blue-50/50' : '')"
        >
          <span class="relative block w-full h-10 rounded-full z-1 max-w-10 flex items-center justify-center bg-gray-100">
             <!-- Icon based on type -->
            <div *ngIf="notification.type === 'document_returned'" class="text-red-500">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3" />
                </svg>
            </div>
            <div *ngIf="notification.type !== 'document_returned'" class="text-blue-500">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" />
                </svg>
            </div>
            <span *ngIf="!notification.is_read" class="absolute top-0 right-0 z-10 h-2.5 w-2.5 rounded-full border-[1.5px] border-white bg-orange-500 dark:border-gray-900"></span>
          </span>
          <span class="block w-full">
            <span class="mb-1.5 block text-theme-sm text-gray-500 dark:text-gray-400">
              <span class="font-medium text-gray-800 dark:text-white/90">
                {{ notification.title }}
              </span>
            </span>
            <span class="block text-xs text-gray-500 dark:text-gray-400 mb-1 line-clamp-2">
                {{ notification.message }}
            </span>
            <span class="flex items-center gap-2 text-gray-400 text-theme-xs">
              <span>{{ formatDate(notification.created_at) }}</span>
            </span>
          </span>
        </app-dropdown-item>
      </li>
      
      <li *ngIf="notifications.length === 0" class="px-4 py-8 text-center text-gray-500 text-sm">
        No notifications yet
      </li>
    </ul>
    
    <div class="pt-3 mt-auto border-t border-gray-100 dark:border-gray-800">
        <a routerLink="/notifications" (click)="closeDropdown()" class="block w-full text-center text-sm font-medium text-orange-500 hover:text-orange-600 cursor-pointer">
            View All Notifications
        </a>
    </div>
  </app-dropdown>
</div>
