<div class="date-picker-container">
  <label *ngIf="label" class="form-label">
    {{ label }}
    <span *ngIf="required" class="required-asterisk">*</span>
  </label>

  <div class="input-wrapper">
    <input
      type="text"
      class="form-input"
      [placeholder]="placeholder"
      [value]="displayValue"
      (click)="toggleCalendar()"
      readonly
    />
    <svg class="calendar-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
      <line x1="16" y1="2" x2="16" y2="6"></line>
      <line x1="8" y1="2" x2="8" y2="6"></line>
      <line x1="3" y1="10" x2="21" y2="10"></line>
    </svg>
  </div>

  <div *ngIf="isOpen" class="calendar-dropdown">
    <div class="calendar-header">
      <button type="button" class="nav-button" (click)="previousMonth()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <div class="header-selectors flex gap-2">
        <select [ngModel]="currentMonth.getMonth()" (change)="onMonthChange($event)" class="month-select" (click)="$event.stopPropagation()">
          <option *ngFor="let month of monthNames; let i = index" [value]="i">{{ month }}</option>
        </select>
        <select [ngModel]="currentMonth.getFullYear()" (change)="onYearChange($event)" class="year-select" (click)="$event.stopPropagation()">
          <option *ngFor="let year of years" [value]="year">{{ year }}</option>
        </select>
      </div>
      <button type="button" class="nav-button" (click)="nextMonth()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>

    <div class="calendar-grid">
      <div class="weekday-row">
        <div *ngFor="let day of weekDays" class="weekday">{{ day }}</div>
      </div>

      <div class="days-grid">
        <div
          *ngFor="let date of days"
          class="day-cell"
          [class.empty]="!date"
          [class.selected]="selectionMode === 'single' && date && isSameDay(date, selectedDate)"
          [class.range-start]="isRangeStart(date)"
          [class.range-end]="isRangeEnd(date)"
          [class.in-range]="isInRange(date)"
          [class.today]="date && isToday(date)"
          (click)="selectDate(date)"
          (mouseenter)="onDateHover(date)"
        >
          {{ date ? date.getDate() : '' }}
        </div>
      </div>
    </div>
  </div>
</div>

<div *ngIf="isOpen" class="calendar-backdrop" (click)="toggleCalendar()"></div>
